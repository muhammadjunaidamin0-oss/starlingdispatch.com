<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgNav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F2340"/>
      <stop offset="100%" style="stop-color:#081525"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5B83D"/>
      <stop offset="50%" style="stop-color:#E89C0A"/>
      <stop offset="100%" style="stop-color:#C07808"/>
    </linearGradient>
    <linearGradient id="birdGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24"/>
      <stop offset="100%" style="stop-color:#D97706"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#E89C0A" flood-opacity="0.3"/>
    </filter>
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="185"/>
    </clipPath>
  </defs>

  <!-- Outer background -->
  <rect width="400" height="400" fill="#050D18"/>

  <!-- Main circle background -->
  <circle cx="200" cy="200" r="195" fill="url(#bgNav)"/>

  <!-- Gold outer ring -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#goldRing)" stroke-width="3"/>

  <!-- Inner subtle ring -->
  <circle cx="200" cy="200" r="165" fill="none" stroke="#E89C0A" stroke-width="0.5" opacity="0.25"/>

  <!-- Subtle geometric background pattern -->
  <g clip-path="url(#circleClip)" opacity="0.04">
    <line x1="200" y1="15" x2="200" y2="385" stroke="#E89C0A" stroke-width="1"/>
    <line x1="15" y1="200" x2="385" y2="200" stroke="#E89C0A" stroke-width="1"/>
    <line x1="60" y1="60" x2="340" y2="340" stroke="#E89C0A" stroke-width="1"/>
    <line x1="340" y1="60" x2="60" y2="340" stroke="#E89C0A" stroke-width="1"/>
    <circle cx="200" cy="200" r="100" fill="none" stroke="#E89C0A" stroke-width="1"/>
    <circle cx="200" cy="200" r="140" fill="none" stroke="#E89C0A" stroke-width="1"/>
  </g>

  <!-- ===== LARGE BIRD ICON centered ===== -->
  <g transform="translate(82, 128) scale(2.15)" filter="url(#shadow)">
    <!-- Upper wing -->
    <path d="M 46 24 L 2 6 L 63 20 Z" fill="url(#birdGold)"/>
    <path d="M 53 22 L 20 10 L 66 19 Z" fill="#FBBF24" opacity="0.45"/>
    <!-- Body -->
    <path d="M 22 29 L 58 20 L 86 29 L 58 38 Z" fill="url(#birdGold)"/>
    <!-- Beak -->
    <path d="M 84 29 L 108 27 L 108 31 Z" fill="#FBBF24"/>
    <!-- Lower tail fork 1 -->
    <path d="M 36 36 L 2 54 L 20 41 Z" fill="url(#birdGold)"/>
    <!-- Lower tail fork 2 -->
    <path d="M 25 40 L 5 60 L 15 47 Z" fill="#C07808" opacity="0.9"/>
    <!-- Eye highlight -->
    <circle cx="80" cy="27" r="2.5" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- Brand name below bird - compact -->
  <text 
    x="200" y="310"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="36"
    font-weight="900"
    letter-spacing="5"
    fill="#FFFFFF"
    text-anchor="middle"
  >STARLING</text>

  <text 
    x="200" y="340"
    font-family="'Arial', sans-serif"
    font-size="14"
    font-weight="300"
    letter-spacing="10"
    fill="#E89C0A"
    text-anchor="middle"
  >DISPATCH</text>

  <!-- Small decorative dots -->
  <circle cx="88" cy="325" r="3" fill="#E89C0A" opacity="0.5"/>
  <circle cx="312" cy="325" r="3" fill="#E89C0A" opacity="0.5"/>
</svg>
