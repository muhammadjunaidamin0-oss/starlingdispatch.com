  <!-- ===== BIRD ICON ===== -->
  <g transform="translate(28, 18) scale(1.1)">
    <path d="M 46 24 L 2 6 L 63 20 Z" fill="url(#goldGrad2)"/>
    <path d="M 52 22 L 18 10 L 66 19 Z" fill="#F5B83D" opacity="0.4"/>
    <path d="M 22 29 L 58 20 L 86 29 L 58 38 Z" fill="url(#goldGrad2)"/>
