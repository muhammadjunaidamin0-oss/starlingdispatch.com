    <path d="M 25 40 L 5 60 L 15 47 Z" fill="#C07808" opacity="0.85"/>
    <circle cx="80" cy="27" r="2.5" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Divider -->
