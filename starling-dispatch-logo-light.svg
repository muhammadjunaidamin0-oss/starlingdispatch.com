      <stop offset="0%" style="stop-color:#E89C0A"/>
      <stop offset="100%" style="stop-color:#C07808"/>
    </linearGradient>
  </defs>

  <!-- White Background -->
  <rect width="520" height="130" fill="#F8F9FB" rx="10"/>
  <rect width="520" height="130" fill="none" stroke="#E0E4EA" stroke-width="1" rx="10"/>

  <!-- Left accent bar -->
